name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Syntax and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile
        run: python -m py_compile video2gif.py

      - name: Install linters
        run: python -m pip install --upgrade ruff

      - name: Lint for syntax errors and undefined names
        run: ruff check --select E9,F63,F7,F82 .
